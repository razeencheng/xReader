services:
  postgres:
    image: postgres:16
    env_file:
      - /etc/xreader/.env
    volumes:
      - /data/xreader/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-xreader} -d $${POSTGRES_DB:-xreader}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - xreader

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - xreader

  api:
    build:
      context: ./server
    command: ["/app/api"]
    env_file:
      - /etc/xreader/.env
    environment:
      XREADER_AI_CONFIG: /etc/xreader/ai.yaml
    volumes:
      - ./config/ai.yaml:/etc/xreader/ai.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - xreader

  worker:
    build:
      context: ./server
    command: ["/app/worker"]
    env_file:
      - /etc/xreader/.env
    environment:
      XREADER_AI_CONFIG: /etc/xreader/ai.yaml
    volumes:
      - ./config/ai.yaml:/etc/xreader/ai.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - xreader

  web:
    build:
      context: ./web
    env_file:
      - /etc/xreader/.env
    environment:
      NEXT_PUBLIC_API_BASE: ""
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - xreader

volumes:
  redisdata: {}

networks:
  xreader:
    internal: true

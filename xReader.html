function Icon({ name, size = 18 }) {
  const d = ICON_PATHS[name] || "";
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}>
      {d.split(/(?=M)/).filter(Boolean).map((seg, i) => <path key={i} d={seg} />)}
    </svg>
  );
}

/* ── SIDEBAR ──────────────────────────────────────────────────────────────── */
function Sidebar({ view, setView }) {
  const items = [
    { id: "today",   icon: "today",   label: "Today" },
    { id: "all",     icon: "all",     label: "All Articles" },
    { id: "starred", icon: "starred", label: "Starred" },
  ];
  const btnBase = { width: 36, height: 36, border: "none", borderRadius: 9, cursor: "pointer",
    display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.12s" };
  return (
    <nav style={{ width: 52, background: "var(--bg-panel)", borderRight: "1px solid var(--border)",
      display: "flex", flexDirection: "column", alignItems: "center", padding: "10px 0", gap: 4, flexShrink: 0 }}>
      <div style={{ fontFamily: "var(--font-article)", fontWeight: 600, fontSize: 15, color: "var(--accent)",
        marginBottom: 14, letterSpacing: -1, userSelect: "none", fontStyle: "italic" }}>x</div>
      {items.map(({ id, icon, label }) => {
        const active = view === id;
        return (
          <button key={id} title={label} onClick={() => setView(id)}
            style={{ ...btnBase, background: active ? "var(--accent-bg)" : "transparent",
              color: active ? "var(--accent)" : "var(--text-3)" }}>
            <Icon name={icon} size={17} />
          </button>
        );
      })}
      <div style={{ flex: 1 }} />
      <button title="Settings" style={{ ...btnBase, background: "transparent", color: "var(--text-3)" }}>
        <Icon name="settings" size={17} />
      </button>
    </nav>
  );
}

      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        padding: compact ? "9px 14px" : "13px 16px",
        borderBottom: "1px solid var(--border-light)",
        cursor: "pointer",
        background: selected ? "var(--bg-selected)" : hovered ? "var(--bg-hover)" : "transparent",
        opacity: article.read && !selected ? 0.5 : 1,
        transition: "background 0.1s, opacity 0.25s",
        position: "relative",
      }}>

      {/* Selected indicator */}
      {selected && <div style={{ position: "absolute", left: 0, top: "22%", bottom: "22%", width: 2.5,
        background: "var(--accent)", borderRadius: "0 2px 2px 0" }} />}

      {/* Source row */}
      <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: compact ? 4 : 6 }}>
        <span style={{ width: 13, height: 13, borderRadius: 3, background: src.color, display: "inline-block",
          flexShrink: 0 }} />
        <span style={{ fontSize: 10.5, color: "var(--text-3)", fontWeight: 500, letterSpacing: 0.3,
          textTransform: "uppercase" }}>{src.name}</span>
        {article.tag && !compact && (
          <span style={{ fontSize: 10, color: "var(--text-3)", background: "var(--bg-hover)",
            borderRadius: 4, padding: "1px 5px" }}>{article.tag}</span>
        )}
        <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--text-3)", flexShrink: 0 }}>{article.age}</span>
      </div>

      {/* Title */}
      <div style={{ fontSize: compact ? 13.5 : 14.5, fontWeight: 600, lineHeight: 1.38,
        color: "var(--text)", marginBottom: compact ? 0 : 6, fontFamily: "var(--font-ui)" }}>
        {article.title}
      </div>

      {/* Footer */}
      {!compact && (
        <div style={{ display: "flex", alignItems: "center", marginTop: 4 }}>
          <span style={{ fontSize: 11, color: "var(--text-3)" }}>{article.readTime} min read</span>
          <div style={{ flex: 1 }} />
          <button onClick={e => { e.stopPropagation(); onStar(article.id); }}
            style={{ border: "none", background: "transparent", cursor: "pointer", padding: "1px 3px",
              color: article.starred ? "var(--star)" : "var(--text-3)", display: "flex",
              opacity: hovered || article.starred ? 1 : 0, transition: "opacity 0.15s" }}>
            <Icon name="star" size={13} />
          </button>
        </div>
      )}
    </div>
  );
}

/* ── ARTICLE LIST ─────────────────────────────────────────────────────────── */
function ArticleList({ articles, selectedId, onSelect, onStar, view, tweaks }) {
  const filtered = useMemo(() => {
    if (view === "starred") return articles.filter(a => a.starred);
    if (view === "today")   return articles.slice(0, 6);
    return articles;
  }, [articles, view]);

  const labels = { today: "今日", all: "全部", starred: "收藏" };
  const isCompact = tweaks.density === "compact";

  return (
    <div style={{ width: tweaks.layout === "focus" ? 0 : 300,
      minWidth: tweaks.layout === "focus" ? 0 : 300,
      borderRight: "1px solid var(--border)",
      display: "flex", flexDirection: "column", overflow: "hidden",
      transition: "width 0.28s cubic-bezier(0.4,0,0.2,1), min-width 0.28s cubic-bezier(0.4,0,0.2,1)",
      background: "var(--bg)" }}>

      {/* Header */}
      <div style={{ padding: "11px 16px 10px", borderBottom: "1px solid var(--border-light)",
        display: "flex", alignItems: "center", gap: 7, flexShrink: 0 }}>
        <span style={{ fontWeight: 600, fontSize: 14.5 }}>{labels[view]}</span>
        <span style={{ fontSize: 11.5, color: "var(--text-3)", background: "var(--bg-hover)",
          borderRadius: 99, padding: "1px 7px", fontWeight: 500 }}>{filtered.length}</span>
      </div>

      {/* List */}
      <div style={{ flex: 1, overflowY: "auto" }}>
        {filtered.length === 0 ? (
          <div style={{ padding: 24, textAlign: "center", color: "var(--text-3)", fontSize: 13 }}>
            Nothing here yet
          </div>
        ) : filtered.map(a => (
          <ArticleCard key={a.id} article={a} selected={a.id === selectedId}
            onSelect={onSelect} onStar={onStar} compact={isCompact} />
        ))}
      </div>
    </div>
  );
}

/* ── BILINGUAL SENTENCE ───────────────────────────────────────────────────── */
function Sentence({ data }) {
  const [open, setOpen] = useState(false);
  if (!data.zh) return <span>{data.en}</span>;

  return (
    <span>
      <span
        onClick={() => setOpen(v => !v)}
        style={{ cursor: "pointer", borderBottom: `1px ${open ? "solid" : "dashed"} var(--accent)`,
          color: open ? "var(--text)" : "inherit", transition: "border-style 0.1s" }}
        title="点击查看中文翻译 · Click for translation">
        {data.en}
      </span>
      {open && (
        <span style={{ display: "block", fontStyle: "italic", fontSize: "0.875em",
          color: "var(--text-2)", borderLeft: "2px solid var(--accent)", paddingLeft: "0.9em",
          marginTop: "0.3em", marginBottom: "0.15em", lineHeight: 1.7 }}>
          {data.zh}
        </span>
      )}
    </span>
  );
}

/* ── READER PANE ──────────────────────────────────────────────────────────── */
function ReaderPane({ article, focusMode, setFocusMode, onStar, tweaks, onMarkRead }) {
  const scrollRef    = useRef(null);
  const [progress, setProgress]   = useState(0);
  const [showZhTitle, setShowZhTitle] = useState(false);
  const [hlBtn, setHlBtn] = useState(null); // { x, y }
  const [marked, setMarked] = useState(false);

  useEffect(() => { setProgress(0); setShowZhTitle(false); setMarked(false); }, [article?.id]);

  const handleScroll = useCallback(() => {
    const el = scrollRef.current;
    if (!el) return;
    const pct = el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight);
    setProgress(Math.min(1, pct));
    if (pct > 0.75 && !marked) { setMarked(true); onMarkRead && onMarkRead(article?.id); }
  }, [article?.id, marked, onMarkRead]);

  const handleMouseUp = useCallback(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) { setHlBtn(null); return; }
    const r = sel.getRangeAt(0).getBoundingClientRect();
    const c = scrollRef.current?.getBoundingClientRect();
    if (!c) return;
    setHlBtn({ x: r.left + r.width / 2 - c.left, y: r.top - c.top - 44 });
  }, []);

  const src = article ? SOURCES[article.source] : null;
  const colWidth = tweaks.layout === "wide" ? "none" : 680;

  if (!article) return (
    <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ textAlign: "center", color: "var(--text-3)" }}>
        <div style={{ fontFamily: "var(--font-article)", fontStyle: "italic", fontSize: 22, marginBottom: 10, color: "var(--text-2)" }}>
          Select an article
        </div>
        <div style={{ fontSize: 12 }}>Press <kbd style={{ background: "var(--bg-hover)", border: "1px solid var(--border)", borderRadius: 4, padding: "0 5px", fontFamily: "var(--font-ui)" }}>j</kbd> / <kbd style={{ background: "var(--bg-hover)", border: "1px solid var(--border)", borderRadius: 4, padding: "0 5px", fontFamily: "var(--font-ui)" }}>k</kbd> to navigate</div>
      </div>
    </div>
  );

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", position: "relative", minWidth: 0 }}>

      {/* Reading progress bar */}
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2.5, zIndex: 10, background: "var(--border-light)" }}>
        <div style={{ height: "100%", width: `${progress * 100}%`, background: "var(--accent)",
          transition: "width 0.1s linear", borderRadius: "0 2px 2px 0" }} />
      </div>

      {/* Toolbar */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 20px 9px",
        borderBottom: "1px solid var(--border-light)", background: "var(--bg)", flexShrink: 0 }}>
        {src && (
          <span style={{ fontSize: 12, color: "var(--text-3)", flex: 1, display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: src.color, display: "inline-block" }} />
            <span style={{ fontWeight: 500, color: "var(--text-2)" }}>{src.name}</span>
            <span>·</span>
            <span>{article.readTime} min read</span>
            {progress > 0.75 && <span style={{ color: "var(--accent)", fontWeight: 500 }}>· Read ✓</span>}
          </span>
        )}
        <button title="Star (S)" onClick={() => onStar(article.id)}
          style={{ border: "none", background: "transparent", cursor: "pointer", display: "flex",
            padding: 5, borderRadius: 7, color: article.starred ? "var(--star)" : "var(--text-3)",
            transition: "color 0.15s" }}>
          <Icon name="star" size={15} />
        </button>
        <button title="Share" style={{ border: "none", background: "transparent", cursor: "pointer",
          display: "flex", padding: 5, borderRadius: 7, color: "var(--text-3)" }}>
          <Icon name="share" size={15} />
        </button>
        <button title={focusMode ? "Exit focus (F)" : "Focus mode (F)"} onClick={() => setFocusMode(f => !f)}
          style={{ border: "none", background: focusMode ? "var(--accent-bg)" : "transparent",
            cursor: "pointer", display: "flex", padding: 5, borderRadius: 7,
            color: focusMode ? "var(--accent)" : "var(--text-3)", transition: "all 0.12s" }}>
          <Icon name={focusMode ? "unfocus" : "focus"} size={15} />
        </button>
      </div>

      {/* Scrollable body */}
      <div ref={scrollRef} onScroll={handleScroll} onMouseUp={handleMouseUp}
        style={{ flex: 1, overflowY: "auto", padding: tweaks.layout === "wide" ? "44px 56px" : "44px 28px",
          position: "relative" }}>

        {/* Highlight button */}
        {hlBtn && (
          <button
            onClick={() => { setHlBtn(null); window.getSelection()?.removeAllRanges(); }}
            style={{ position: "absolute", left: hlBtn.x, top: Math.max(8, hlBtn.y), transform: "translateX(-50%)",
              background: "var(--text)", color: "var(--bg)", border: "none", borderRadius: 7,
              padding: "5px 12px", fontSize: 12, fontFamily: "var(--font-ui)", fontWeight: 500,
              cursor: "pointer", zIndex: 20, boxShadow: "0 4px 16px rgba(0,0,0,0.25)",
              display: "flex", alignItems: "center", gap: 5 }}>
            Highlight
          </button>
        )}

        <article style={{ maxWidth: colWidth, margin: "0 auto" }}>

          {/* Title */}
          <h1 style={{ fontFamily: "var(--font-article)", fontSize: tweaks.fontSize + 10,
            fontWeight: 600, lineHeight: 1.22, color: "var(--text)", marginBottom: 10, letterSpacing: -0.6 }}>
            {article.title}
          </h1>

          {/* Chinese title */}
          {article.titleZh && (
            <div style={{ marginBottom: 18 }}>
              {showZhTitle ? (
                <p style={{ fontFamily: "var(--font-article)", fontSize: tweaks.fontSize + 4,
                  color: "var(--text-2)", fontStyle: "italic", lineHeight: 1.35 }}>
                  {article.titleZh}
                </p>
              ) : (
                <button onClick={() => setShowZhTitle(true)}
                  style={{ border: "1px solid var(--border)", background: "transparent",
                    borderRadius: 6, padding: "3px 9px", fontSize: 12, color: "var(--text-3)",
                    cursor: "pointer", display: "flex", alignItems: "center", gap: 5, transition: "all 0.12s" }}>
                  <Icon name="translate" size={12} /> 显示中文标题
                </button>
              )}
            </div>
          )}

          {/* Byline */}
          <div style={{ fontFamily: "var(--font-ui)", fontSize: 12.5, color: "var(--text-3)",
            marginBottom: 36, display: "flex", gap: 10, alignItems: "center" }}>
            <span>{article.age} ago</span>
            <span style={{ color: "var(--border)" }}>·</span>
            <span>{article.readTime} min read</span>
            {article.tag && <>
              <span style={{ color: "var(--border)" }}>·</span>
              <span style={{ background: "var(--bg-hover)", borderRadius: 5, padding: "1px 7px" }}>{article.tag}</span>
            </>}
          </div>

          {/* Body */}
          <div style={{ fontFamily: "var(--font-article)", fontSize: tweaks.fontSize,
            lineHeight: 1.9, color: "var(--text)" }}>
            {article.content.map((block, i) => {
              if (block.type === "callout") return (
                <div key={i} style={{ background: "var(--callout-bg)", borderLeft: "3px solid var(--accent)",
                  borderRadius: "0 10px 10px 0", padding: "12px 18px", marginBottom: 30,
                  fontSize: tweaks.fontSize * 0.9 }}>
                  <ul style={{ paddingLeft: "1.25em", margin: 0, color: "var(--text-2)", lineHeight: 1.75 }}>
                    {block.items.map((item, j) => <li key={j} style={{ marginBottom: 5 }}>{item}</li>)}
                  </ul>
                </div>
              );
              if (block.type === "paragraph") return (
                <p key={i} style={{ marginBottom: "1.6em" }}>
                  {block.sentences.map((s, j) => <Sentence key={j} data={s} />)}
                </p>
              );
              return null;
            })}
          </div>
        </article>
      </div>
    </div>
  );
}

                <kbd style={{ background: "var(--bg-hover)", border: "1px solid var(--border)",

/* ── TWEAKS PANEL ─────────────────────────────────────────────────────────── */
function TweaksPanel({ tweaks, onChange, visible }) {
  if (!visible) return null;

  const Section = ({ label, children }) => (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: 0.7,
        color: "var(--text-3)", fontWeight: 500, marginBottom: 7 }}>{label}</div>
      {children}
    </div>
  );

  const Chip = ({ label, value, field }) => {
    const active = tweaks[field] === value;
    return (
      <button onClick={() => onChange(field, value)}
        style={{ padding: "4px 11px", fontSize: 12, border: `1px solid ${active ? "var(--accent)" : "var(--border)"}`,
          borderRadius: 6, cursor: "pointer", background: active ? "var(--accent-bg)" : "transparent",
          color: active ? "var(--accent)" : "var(--text-2)", fontFamily: "var(--font-ui)",
          transition: "all 0.1s", fontWeight: active ? 500 : 400 }}>
        {label}
      </button>
    );
  };

  const ACCENTS = [
    { value: "blue",  color: "oklch(50% 0.16 255)", label: "Blue"  },
    { value: "sage",  color: "oklch(52% 0.12 160)", label: "Sage"  },
    { value: "ember", color: "oklch(52% 0.15 32)",  label: "Ember" },
    { value: "rose",  color: "oklch(52% 0.16 5)",   label: "Rose"  },
  ];

  return (
    <div style={{ position: "fixed", bottom: 20, right: 20, background: "var(--bg)",
      border: "1px solid var(--border)", borderRadius: 14, padding: "18px 20px",
      boxShadow: "0 8px 32px rgba(0,0,0,0.18)", zIndex: 100, minWidth: 240,
      fontFamily: "var(--font-ui)" }}>
      <div style={{ fontWeight: 600, fontSize: 13.5, marginBottom: 16 }}>Tweaks</div>

      <Section label="Layout">
        <div style={{ display: "flex", gap: 6 }}>
          <Chip label="Classic" value="classic" field="layout" />
          <Chip label="Focus" value="focus" field="layout" />
          <Chip label="Wide" value="wide" field="layout" />
        </div>
      </Section>

      <Section label="Density">
        <div style={{ display: "flex", gap: 6 }}>
          <Chip label="Comfortable" value="comfortable" field="density" />
          <Chip label="Compact" value="compact" field="density" />
        </div>
      </Section>

      <Section label="Font size">
        <div style={{ display: "flex", gap: 6 }}>
          {[14, 16, 17, 19, 21].map(s => <Chip key={s} label={`${s}`} value={s} field="fontSize" />)}
        </div>
      </Section>

      <Section label="Accent">
        <div style={{ display: "flex", gap: 9, alignItems: "center" }}>
          {ACCENTS.map(({ value, color, label }) => (
            <button key={value} onClick={() => onChange("accent", value)} title={label}
              style={{ width: 22, height: 22, borderRadius: "50%", background: color, border: "none",
                cursor: "pointer", outline: tweaks.accent === value ? `2.5px solid ${color}` : "none",
                outlineOffset: 2, boxShadow: tweaks.accent === value ? `0 0 0 1px var(--bg)` : "none",
                transition: "all 0.1s" }} />
          ))}
        </div>
      </Section>
    </div>
  );
}

/* ── APP ──────────────────────────────────────────────────────────────────── */
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "layout": "wide",
    "density": "comfortable",
    "fontSize": 16,
    "accent": "rose"
  }/*EDITMODE-END*/;

  const [articles, setArticles]       = useState(ARTICLES);
  const [selectedId, setSelectedId]   = useState(1);
  const [view, setView]               = useState("today");
  const [focusMode, setFocusMode]     = useState(false);
  const [showKbd, setShowKbd]         = useState(false);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [tweaks, setTweaks]           = useState(() => {
    try { return { ...TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem("xr-tweaks") || "{}") }; }
    catch { return TWEAK_DEFAULTS; }
  });

  // Persist tweaks
  useEffect(() => { localStorage.setItem("xr-tweaks", JSON.stringify(tweaks)); }, [tweaks]);

  // Persist selected article
  useEffect(() => {
    const saved = localStorage.getItem("xr-selected");
    if (saved) setSelectedId(Number(saved));
  }, []);
  useEffect(() => { localStorage.setItem("xr-selected", selectedId); }, [selectedId]);

  // Apply accent
  useEffect(() => {
    const MAP = {
      blue:  { a: "oklch(50% 0.16 255)", b: "oklch(95% 0.04 255)" },
      sage:  { a: "oklch(52% 0.12 160)", b: "oklch(95% 0.04 160)" },
      ember: { a: "oklch(52% 0.15 32)",  b: "oklch(96% 0.04 32)"  },
      rose:  { a: "oklch(52% 0.16 5)",   b: "oklch(96% 0.04 5)"   },
    };
    const c = MAP[tweaks.accent] || MAP.blue;
    document.documentElement.style.setProperty("--accent",    c.a);
    document.documentElement.style.setProperty("--accent-bg", c.b);
  }, [tweaks.accent]);

  // Tweaks host protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode")   setTweaksVisible(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksVisible(false);
      if (e.data?.type === "__edit_mode_set_keys")   setTweaks(t => ({ ...t, ...e.data.edits }));
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const filtered = useMemo(() => {
    if (view === "starred") return articles.filter(a => a.starred);
    if (view === "today")   return articles.slice(0, 6);
    return articles;
  }, [articles, view]);

  const selectArticle = useCallback((id) => {
    setSelectedId(id);
    setArticles(prev => prev.map(a => a.id === id ? { ...a, read: true } : a));
  }, []);

  const starArticle = useCallback((id) => {
    setArticles(prev => prev.map(a => a.id === id ? { ...a, starred: !a.starred } : a));
  }, []);

  const markRead = useCallback((id) => {
    setArticles(prev => prev.map(a => a.id === id ? { ...a, read: true } : a));
  }, []);

  const handleTweakChange = useCallback((field, value) => {
    setTweaks(t => {
      const next = { ...t, [field]: value };
      window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
      return next;
    });
  }, []);

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      if (["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
      const cur = filtered.findIndex(a => a.id === selectedId);
      switch (e.key) {
        case "j": if (cur < filtered.length - 1) selectArticle(filtered[cur + 1].id); break;
        case "k": if (cur > 0) selectArticle(filtered[cur - 1].id); break;
        case "s": starArticle(selectedId); break;
        case "f": setFocusMode(v => !v); break;
        case "?": setShowKbd(v => !v); break;
        case "Escape": setShowKbd(false); setFocusMode(false); break;
        case "r": markRead(selectedId); break;
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [filtered, selectedId, selectArticle, starArticle, markRead]);

  const selectedArticle = articles.find(a => a.id === selectedId) || null;

  return (
    <div style={{ display: "flex", height: "100vh", width: "100vw", overflow: "hidden" }}>

      {/* Sidebar — always visible, even in focus mode */}
      {!focusMode && <Sidebar view={view} setView={setView} />}

      {/* Article list */}
      {!focusMode && (
        <ArticleList articles={articles} selectedId={selectedId}
          onSelect={selectArticle} onStar={starArticle} view={view} tweaks={tweaks} />
      )}

      {/* Reader */}
      <ReaderPane article={selectedArticle} focusMode={focusMode}
        setFocusMode={setFocusMode} onStar={starArticle}
        tweaks={tweaks} onMarkRead={markRead} />

      {/* Keyboard shortcut hint */}
      <button onClick={() => setShowKbd(true)} title="Keyboard shortcuts (?)"
        style={{ position: "fixed", bottom: 14, left: focusMode ? 14 : 14,
          border: "1px solid var(--border)", background: "var(--bg-panel)", borderRadius: 8,
          padding: "5px 9px", cursor: "pointer", color: "var(--text-3)",
          display: "flex", alignItems: "center", zIndex: 50, gap: 5, fontSize: 11,
          fontFamily: "var(--font-ui)", transition: "opacity 0.2s", opacity: 0.7 }}>
        <Icon name="keyboard" size={13} />
      </button>

      {showKbd && <ShortcutsModal onClose={() => setShowKbd(false)} />}

      <TweaksPanel tweaks={tweaks} onChange={handleTweakChange} visible={tweaksVisible} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
